name: Build

# check  – analyze + unit tests (every push and PR, Linux, cheap)
# web    – Flutter web preview; deployed to GitHub Pages from main
#          (https://dankarmazin-a11y.github.io/HRzones/)
# android – debug APK for the owner's Android phone (every push and PR, Linux, no Mac minutes)
# ios    – unsigned IPA for Sideloadly (main + manual runs; macOS minutes are expensive)

on:
  workflow_dispatch:
    inputs:
      ios_runner:
        description: 'macOS machine for the iOS build (try macos-15-intel if the Apple-chip machines are stuck in the queue)'
        type: choice
        default: macos-15-intel
        options: [macos-26, macos-15, macos-15-intel]
  pull_request:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date and everything is formatted
        run: |
          dart run build_runner build
          dart format lib test
          git diff --exit-code -- lib test
      - run: flutter analyze
      - run: flutter test

  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build web preview
        run: |
          BUILD_ID="${GITHUB_SHA::7}"
          flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=APP_BUILD="$BUILD_ID $(date -u +%Y-%m-%d)"
          # Cache-busting: new URLs for the app code on every build (see web/flutter_bootstrap.js).
          sed -i "s/__BUILD_ID__/$BUILD_ID/" build/web/flutter_bootstrap.js
          sed -i "s/flutter_bootstrap.js\"/flutter_bootstrap.js?v=$BUILD_ID\"/" build/web/index.html
          grep -q "v=$BUILD_ID" build/web/index.html
          grep -q "\"$BUILD_ID\"" build/web/flutter_bootstrap.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
          name: web-preview

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android app (debug APK)
        run: flutter build apk --debug --dart-define=APP_BUILD="${GITHUB_SHA::7} $(date -u +%Y-%m-%d)" --dart-define=STADIA_KEY="${{ secrets.STADIA_KEY }}"
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk HRZones.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HRZones-apk
          path: HRZones.apk

  deploy-web:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: web-preview

  # Does this push to main change anything the iPhone app is built from? Android-only and docs
  # pushes skip the (scarce, slow) Mac build – their IPA would be identical.
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          BEFORE="${{ github.event.before }}"
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "$FILES"
          # Anything outside android/, docs and Markdown → build the iPhone app.
          if [ -z "$FILES" ] || echo "$FILES" | grep -qvE '^(android/|docs/)|\.md$'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    if: >-
      always() && needs.check.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.ref == 'refs/heads/main' && needs.changes.outputs.ios == 'true'))
    needs: [check, changes]
    runs-on: ${{ inputs.ios_runner || 'macos-15-intel' }}
    timeout-minutes: 45
    # Only ONE Mac build at a time across the whole repo (a burst of parallel macOS builds got the
    # account suspended in 2026-11). A newer build waits; an older waiting one is dropped.
    concurrency:
      group: ios-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign --dart-define=APP_BUILD="${GITHUB_SHA::7} $(date -u +%Y-%m-%d)" --dart-define=STADIA_KEY="${{ secrets.STADIA_KEY }}"
      - name: Package IPA
        run: |
          APP=build/ios/iphoneos/Runner.app
          codesign --force --deep --sign - "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry HRZones.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HRZones-ipa
          path: HRZones.ipa
