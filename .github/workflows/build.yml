name: Build

# check  – analyze + unit tests (every push and PR, Linux, cheap)
# web    – Flutter web preview; deployed to GitHub Pages from main
#          (https://dankarmazin-a11y.github.io/HRzones/)
# ios    – unsigned IPA for Sideloadly (main + manual runs; macOS minutes are expensive)

on:
  workflow_dispatch:
    inputs:
      ios_runner:
        description: 'macOS machine for the iOS build (try macos-15-intel if the Apple-chip machines are stuck in the queue)'
        type: choice
        default: macos-26
        options: [macos-26, macos-15, macos-15-intel]
  pull_request:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date and everything is formatted
        run: |
          dart run build_runner build
          dart format lib test
          git diff --exit-code -- lib test
      - run: flutter analyze
      - run: flutter test

  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build web preview
        run: |
          BUILD_ID="${GITHUB_SHA::7}"
          flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=APP_BUILD="$BUILD_ID $(date -u +%Y-%m-%d)"
          # Cache-busting: new URLs for the app code on every build (see web/flutter_bootstrap.js).
          sed -i "s/__BUILD_ID__/$BUILD_ID/" build/web/flutter_bootstrap.js
          sed -i "s/flutter_bootstrap.js\"/flutter_bootstrap.js?v=$BUILD_ID\"/" build/web/index.html
          grep -q "v=$BUILD_ID" build/web/index.html
          grep -q "\"$BUILD_ID\"" build/web/flutter_bootstrap.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
          name: web-preview

  deploy-web:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: web-preview

  ios:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ${{ inputs.ios_runner || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign --dart-define=APP_BUILD="${GITHUB_SHA::7} $(date -u +%Y-%m-%d)" --dart-define=STADIA_KEY="${{ secrets.STADIA_KEY }}"
      - name: Package IPA
        run: |
          APP=build/ios/iphoneos/Runner.app
          codesign --force --deep --sign - "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry HRZones.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HRZones-ipa
          path: HRZones.ipa
