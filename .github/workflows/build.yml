name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project HRZones.xcodeproj -scheme HRZones \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Embed HealthKit entitlement and package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/HRZones.app
          codesign --force --sign - --entitlements Support/HRZones.entitlements "$APP"
          echo "Entitlements inside the app:"
          codesign -d --entitlements - "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry HRZones.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HRZones-ipa
          path: HRZones.ipa
