name: Build

# check  – analyze + unit tests (every push and PR, Linux, cheap)
# web    – Flutter web preview; deployed to GitHub Pages from main
#          (https://dankarmazin-a11y.github.io/HRzones/)
# ios    – unsigned IPA for Sideloadly (main + manual runs; macOS minutes are expensive)

on:
  workflow_dispatch:
  pull_request:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated database code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
          name: web-preview

  deploy-web:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: web-preview

  ios:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          APP=build/ios/iphoneos/Runner.app
          codesign --force --deep --sign - "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry HRZones.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: HRZones-ipa
          path: HRZones.ipa
